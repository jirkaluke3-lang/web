<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor zápisů – IN—FORM—ARCHITEKTI</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="../fonty/fonty.css">
<meta name="robots" content="noindex">
<script src="config.js"></script>
<style>
html,body{margin:0;height:100%;background:#fff}
body{display:flex;flex-direction:column;font-family:'Ciutadella',system-ui,sans-serif}
.pruh{display:flex;align-items:center;gap:14px;height:40px;padding:0 16px;background:#1D3FBF;color:#fff;flex:none}
.pruh a{color:inherit;text-decoration:none;font-weight:600;font-size:17px;letter-spacing:-.01em}
.pruh a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.pruh span{font-size:15px}
.pruh i{width:14px;height:14px;background:#fff;}
iframe{flex:1;width:100%;border:0;display:block}
.chyba{padding:24px 16px;max-width:36em;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div class="pruh"><i aria-hidden="true"></i><a href="./">projektové řízení</a><span>Editor zápisů</span></div>
<script>
(function () {
  var url = window.APP_URL || '';
  if (!/^https:\/\/script\.google\.com\//.test(url) || /VASE-ID/.test(url)) {
    document.body.insertAdjacentHTML('beforeend', '<p class="chyba">Adresa aplikace zatím není nastavená. Vložte ji do souboru config.js v repozitáři.</p>');
    return;
  }
  var f = document.createElement('iframe');
  f.title = 'Editor zápisů';
  f.allow = 'camera; clipboard-write; fullscreen';
  f.src = url + '';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
