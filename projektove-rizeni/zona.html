<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klientská zóna – IN—FORM—ARCHITEKTI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181A;--ink2:#4A4F55;--mut:#6B7178;--line:#D8D6CF;--line2:#E8E6E0;--bg:#F7F6F2;--card:#FFFFFF;
  --red:#B42318;--amber:#A35A08;--green:#2E7D4F;--sel:#ECEAE4;--bar:#C9C6BE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:24px 24px 80px}
h1{font-size:28px;margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;font-weight:600;color:var(--ink2)}
.mut{color:var(--mut)}.mono{font-family:'IBM Plex Mono',monospace}
.lnk{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.btn{min-height:40px;padding:8px 16px;border:1px solid var(--ink);background:var(--card);border-radius:0}
.btn:hover{background:var(--sel)}.btn.p{background:var(--ink);color:#fff}
input[type=text],input[type=email],input[type=password],select{border:1px solid #B9B6AE;background:#fff;padding:8px 10px;min-height:40px;border-radius:0;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{background:none;border:0;padding:14px 0 12px;border-bottom:2px solid transparent;color:var(--ink2);white-space:nowrap}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:32px}
.kpi div{padding:16px 16px 14px 0}
.kpi b{display:block;font-size:34px;font-weight:500;line-height:1.1;letter-spacing:-.01em}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi .red b{color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;margin-bottom:36px}
.sec{margin-bottom:36px}
.cas{position:relative;height:8px;background:var(--line2);margin:10px 0 6px}
.cas i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.cas .dnes{position:absolute;top:-6px;width:2px;height:20px;background:var(--red)}
.osa{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.odd{display:grid;grid-template-columns:minmax(0,1fr) 140px 48px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px}
.pb{height:6px;background:var(--line2);position:relative}.pb i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.r{text-align:right}
.lst{border-top:1px solid var(--ink)}
.li{display:grid;grid-template-columns:110px minmax(0,1fr) 170px;gap:16px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px;align-items:baseline}
.li .k{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink2)}
.late{color:var(--red)}
.st{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;margin:3px 4px 0 0;border:1px solid #9A9EA3;color:var(--ink2);letter-spacing:.02em;white-space:nowrap}
.st.rf{border:1.5px solid var(--red);color:var(--red)}.st.sp{border-color:var(--green);color:var(--green)}.st.zp{border-color:var(--red);color:var(--red)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 0 16px}
.bar .grow{flex:1 1 220px}.bar select{width:auto}
.bod{border-bottom:1px solid var(--line2)}
.bodh{display:grid;grid-template-columns:70px minmax(0,1fr) 120px 60px;gap:16px;padding:12px 0;align-items:baseline;width:100%;background:none;border:0;text-align:left}
.bodh:hover{background:var(--sel)}
.bodh .zn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2)}
.bodh .nm{font-weight:600}
.det{padding:4px 0 16px 86px}
.poz{display:grid;grid-template-columns:170px minmax(0,1fr) 190px;gap:14px;padding:8px 0;border-top:1px dotted var(--line2);font-size:14px}
.poz .k{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2);line-height:1.5}
.poz .typ{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.poz .sd{font-size:13.5px;color:var(--ink2)}
.poz.sch .t{font-style:italic;color:var(--ink2)}
.dpl{display:block;margin-top:4px}.dpl .kdl{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2)}
.del{text-decoration:line-through;color:var(--mut)}
.kd{display:grid;grid-template-columns:120px minmax(0,1fr) 170px;gap:20px;padding:16px 0;border-bottom:1px solid var(--line2);align-items:start}
.kd .c{font-weight:600}.kd .pr{white-space:pre-line}
.kon{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.kon .r1{font-weight:600;margin-top:6px}
.empty{padding:28px 0;color:var(--mut)}
.box{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--ink);padding:28px}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row:hover{background:var(--sel)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;max-width:90%;z-index:20;display:none}
.toast.err{background:var(--red)}
.busy{position:fixed;inset:0;background:rgba(247,246,242,.6);display:none;align-items:center;justify-content:center;z-index:15;font-weight:600}
.vyk{position:fixed;inset:0;background:var(--bg);z-index:12;flex-direction:column}
.vyk .vh{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ink)}
.vyk .vb{flex:1;overflow:auto;padding:16px}
.plan{position:relative;display:inline-block;max-width:100%}.plan img{display:block;max-width:100%;height:auto;border:1px solid var(--line)}
.pin{position:absolute;transform:translate(-50%,-100%);background:#9A9EA3;color:#fff;font:600 11px 'IBM Plex Mono',monospace;padding:2px 5px;white-space:nowrap}
.pin.akt{background:var(--ink);outline:3px solid #F2C94C}
.osa{flex-wrap:wrap;gap:4px 12px}
svg text{font-family:'IBM Plex Sans',system-ui,sans-serif}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
@media (max-width:860px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.kon{grid-template-columns:1fr}
  .li,.poz,.kd{grid-template-columns:1fr;gap:4px}.det{padding-left:0}.bodh{grid-template-columns:60px minmax(0,1fr) 50px}.bodh .x{display:none}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="busy" class="busy">Na&#269;&#237;t&#225;m&#8230;</div>
<div id="toast" class="toast" role="status"></div>
<div id="vyk" class="vyk" style="display:none"></div>
<script>
(function () {
'use strict';
var S = { token: null, zakazky: [], D: null, tab: 'prehled', f: { oddil: '', stav: 'otevrene', firma: '', q: '' }, otevreny: {} };
var $app = document.getElementById('app');
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dnes() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dmr(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? +m[3] + '.' + +m[2] + '.' + m[1] : ''; }
function kdc(v) { var m = String(v || '').match(/(\d+)/); return m ? parseInt(m[1], 10) : 0; }
function ids(s) { return String(s == null ? '' : s).split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
function toast(t, err) { var el = document.getElementById('toast'); el.textContent = t; el.className = 'toast' + (err ? ' err' : ''); el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, err ? 7000 : 3000); }
function busy(on) { document.getElementById('busy').style.display = on ? 'flex' : 'none'; }
// Na webu (informarchitekti.cz) se aplikace vola jako datova sluzba pres doPost ve Web.gs;
// uvnitr Apps Scriptu pres google.script.run.
var NA_WEBU = !!window.APP_URL && !(window.google && google.script && google.script.run);
function volatSluzbu(fn, args) {
  return fetch(window.APP_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit',
      redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var o;
      try { o = JSON.parse(t); } catch (e) {
        var x = new Error('Služba aplikace neodpověděla. Zkuste to za chvíli znovu.'); x.ramec = true; throw x;
      }
      if (o.err) throw new Error(o.err);
      return o.ok;
    }, function () { throw new Error('Bez spojení se službou aplikace. Zkontrolujte připojení k internetu.'); });
}
function server(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (NA_WEBU) return volatSluzbu(fn, args);
  return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e); })[fn].apply(null, args);
  });
}
function api(akce, data) {
  busy(true);
  return server('zonaApi', S.token, akce, data).then(function (r) { busy(false); return r; }, function (e) {
    busy(false); var m = (e && e.message) || String(e);
    if (m.indexOf('PRIHLASENI') >= 0) { S.token = null; ss('zona_token', null); toast('P\u0159ihl\u00e1\u0161en\u00ed vypr\u0161elo.', true); login(); }
    else toast(m.replace(/^Error:\s*/, ''), true);
    throw e;
  });
}

/* ---------- data ---------- */
function idx() {
  var D = S.D, t = dnes();
  D.lideById = {}; D.lide.forEach(function (l) { D.lideById[l['ID']] = l; });
  D.jById = {}; D.jednani.forEach(function (j) { D.jById[j['ID']] = j; });
  D.oddNazev = {}; D.oddily.forEach(function (o) { D.oddNazev[+o['\u010c\u00edslo']] = o['N\u00e1zev']; });
  D.zByBod = {}; D.dopl = {};
  D.zaznamy.forEach(function (z) {
    var j = D.jById[z['Jedn\u00e1n\u00ed']] || {};
    z._datum = j['Datum'] || z['Datum'] || '';
    z._jedn = j['Typ'] === 'KD' ? 'KD' + pad(kdc(j['\u010c\u00edslo'])) : String(j['\u010c\u00edslo'] || '');
    // doplnek starsi poznamky: zobrazi se pod ni
    if (z['Dopl\u0148uje']) { (D.dopl[z['Dopl\u0148uje']] = D.dopl[z['Dopl\u0148uje']] || []).push(z); return; }
    z._ukol = z['Typ'] === '\u00fakol';
    z._ok = z._ukol && z['Vy\u0159e\u0161eno'] === 'ano';
    z._pozde = z._ukol && !z._ok && z['Term\u00edn'] && String(z['Term\u00edn']) < t;
    (D.zByBod[z['Bod']] = D.zByBod[z['Bod']] || []).push(z);
  });
  Object.keys(D.zByBod).forEach(function (k) { D.zByBod[k].sort(function (a, b) { return a._datum < b._datum ? -1 : a._datum > b._datum ? 1 : String(a['Zna\u010dka']) < String(b['Zna\u010dka']) ? -1 : 1; }); });
  D.body.forEach(function (b) {
    var u = (D.zByBod[b['ID']] || []).filter(function (z) { return z._ukol && z['Vrstva'] === 'KD'; });
    var ok = u.filter(function (z) { return z._ok; }).length;
    b._ukoly = u.length; b._ok = ok;
    b._zruseno = !!b['Zru\u0161eno KD'];
    b._pct = u.length ? Math.round(ok / u.length * 100) : null;
    b._hotovo = (u.length > 0 && ok === u.length) || b._zruseno;
    b._pozde = !b._zruseno && u.some(function (z) { return z._pozde; });
    b._firmy = [];
    u.forEach(function (z) { if (!z._ok) ids(z['\u0158e\u0161itel\u00e9']).forEach(function (id) { var f = (D.lideById[id] || {})['Firma']; if (f && b._firmy.indexOf(f) < 0) b._firmy.push(f); }); });
  });
  D.kd = D.jednani.filter(function (j) { return j['Typ'] === 'KD'; }).sort(function (a, b) { return kdc(a['\u010c\u00edslo']) - kdc(b['\u010c\u00edslo']); });
  var zruseneBody = {}; D.body.forEach(function (b) { if (b._zruseno) zruseneBody[b['ID']] = true; });
  // ukoly zrusenych bodu se do prehledu a terminu nepocitaji
  D.ukoly = D.zaznamy.filter(function (z) { return z._ukol && z['Vrstva'] === 'KD' && !z['Dopl\u0148uje'] && !zruseneBody[z['Bod']]; });
}
function jmeno(id) { var l = S.D.lideById[id]; return l ? ((l['Jm\u00e9no'] ? String(l['Jm\u00e9no']).charAt(0) + '. ' : '') + (l['P\u0159\u00edjmen\u00ed'] || '')) : ''; }
function resitel(id) { var l = S.D.lideById[id] || {}; return jmeno(id) + (l['Role'] ? ' / ' + l['Role'] : ''); }

/* ---------- obrazovky ---------- */
function login() {
  $app.innerHTML = '<form class="box" id="fl"><div class="kicker">Klientsk\u00e1 z\u00f3na</div><h1>P\u0159ehled stavby</h1>' +
    '<label class="f">E-mail<input type="email" name="email" autocomplete="username" required value="' + esc(ss('zona_email') || '') + '"></label>' +
    '<label class="f">PIN<input type="password" name="pin" inputmode="numeric" autocomplete="current-password" required></label>' +
    '<button class="btn p" type="submit">P\u0159ihl\u00e1sit</button><p class="mut" style="margin:0;font-size:13px">P\u0159\u00edstup p\u0159id\u011bluje spr\u00e1vce zak\u00e1zky.</p></form>';
  document.getElementById('fl').onsubmit = function (ev) {
    ev.preventDefault(); var fd = new FormData(ev.target); busy(true);
    server('prihlasit', fd.get('email'), fd.get('pin')).then(function (r) {
      busy(false); S.token = r.token; ss('zona_token', r.token); ss('zona_email', r.email); zakazky();
    }, function (e) { busy(false); toast(((e && e.message) || String(e)).replace(/^Error:\s*/, ''), true); });
  };
}
function zakazky() {
  api('zakazky').then(function (z) {
    S.zakazky = z;
    if (z.length === 1) return otevrit(z[0].id);
    $app.innerHTML = '<div class="top"><div><div class="kicker">Klientsk\u00e1 z\u00f3na</div><h1>Va\u0161e zak\u00e1zky</h1></div><button class="lnk" id="odhl">Odhl\u00e1sit</button></div>' +
      (z.map(function (x) { return '<button class="row" data-id="' + esc(x.id) + '"><b>' + esc(x.nazev) + '</b><span class="mut">otev\u0159\u00edt</span></button>'; }).join('') ||
       '<p class="empty">Nem\u00e1te p\u0159\u00edstup k \u017e\u00e1dn\u00e9 zak\u00e1zce.</p>');
    $app.querySelectorAll('[data-id]').forEach(function (b) { b.onclick = function () { otevrit(b.dataset.id); }; });
    document.getElementById('odhl').onclick = odhlasit;
  });
}
function odhlasit() { S.token = null; ss('zona_token', null); login(); }
function otevrit(id) { api('nacist', { zakazkaId: id }).then(function (D) { S.D = D; idx(); render(); }); }

function render() {
  var D = S.D, posl = D.kd[D.kd.length - 1];
  var tabs = [['prehled', 'P\u0159ehled'], ['body', 'Body'], ['ukoly', 'Moje \u00fakoly'], ['zapisy', 'Z\u00e1pisy'], ['kontakty', 'Kontakty']];
  if (D.ja.prava.ceny) tabs.splice(4, 0, ['faktury', 'Faktury']);
  if (D.zl.length) tabs.splice(4, 0, ['zl', 'Zm\u011bnov\u00e9 listy']);
  var h = '<div class="top"><div><div class="kicker">Klientsk\u00e1 z\u00f3na</div><h1>' + esc(D.nastaveni.akce) + '</h1>' +
    '<div class="mut">' + (posl ? 'Posledn\u00ed kontroln\u00ed den ' + kdc(posl['\u010c\u00edslo']) + ' \u00b7 ' + dmr(posl['Datum']) : 'Zat\u00edm \u017e\u00e1dn\u00fd vydan\u00fd z\u00e1pis') +
    (posl && posl['Dal\u0161\u00ed KD'] ? ' \u00b7 dal\u0161\u00ed KD ' + dmr(posl['Dal\u0161\u00ed KD']) + (posl['Dal\u0161\u00ed KD \u010das'] ? ' v ' + esc(posl['Dal\u0161\u00ed KD \u010das']) : '') : '') + '</div></div>' +
    '<div style="display:flex;gap:16px;align-items:center"><span class="mut">' + esc(D.ja.jmeno) + (D.ja.firma ? ' \u00b7 ' + esc(D.ja.firma) : '') + '</span>' +
    (S.zakazky.length > 1 ? '<button class="lnk" id="zpet">Jin\u00e1 zak\u00e1zka</button>' : '') + '<button class="lnk" id="odhl">Odhl\u00e1sit</button></div></div>' +
    '<div class="tabs">' + tabs.map(function (t) { return '<button data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div>' +
    '<div id="obsah"></div>';
  $app.innerHTML = h;
  $app.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { S.tab = b.dataset.tab; render(); }; });
  document.getElementById('odhl').onclick = odhlasit;
  var z = document.getElementById('zpet'); if (z) z.onclick = zakazky;
  ({ prehled: prehled, body: body, ukoly: mojeUkoly, zapisy: zapisy, zl: zmenoveListy, faktury: faktury, kontakty: kontakty })[S.tab]();
}

function prehled() {
  var D = S.D, t = dnes();
  var ok = D.ukoly.filter(function (z) { return z._ok; }).length;
  var pct = D.ukoly.length ? Math.round(ok / D.ukoly.length * 100) : 0;
  var otevrene = D.body.filter(function (b) { return !b._hotovo && b._ukoly; }).length;
  var pozde = D.ukoly.filter(function (z) { return z._pozde; }).length;
  var rf = D.body.filter(function (b) { return b['Priorita'] === 'RED FLAG' && !b._hotovo; });
  var h = '<div class="kpi"><div><b>' + pct + ' %</b><span>spln\u011bn\u00fdch \u00fakol\u016f (' + ok + ' z ' + D.ukoly.length + ')</span></div>' +
    '<div><b>' + otevrene + '</b><span>otev\u0159en\u00fdch bod\u016f</span></div>' +
    '<div class="' + (pozde ? 'red' : '') + '"><b>' + pozde + '</b><span>\u00fakol\u016f po term\u00ednu</span></div>' +
    '<div class="' + (rf.length ? 'red' : '') + '"><b>' + rf.length + '</b><span>red flag \u2013 vy\u017eaduje \u0159e\u0161en\u00ed</span></div></div>';
  // cas realizace
  var zac = D.nastaveni.datum_zahajeni, kon = D.nastaveni.smluvni_termin;
  var casH = '';
  if (zac && kon) {
    var celk = new Date(kon) - new Date(zac), ub = new Date(t) - new Date(zac);
    var p = Math.max(0, Math.min(100, Math.round(ub / celk * 100)));
    casH = '<div class="sec"><h2>Doba realizace</h2><div class="cas"><i style="width:' + p + '%"></i></div>' +
      '<div class="osa"><span>zah\u00e1jen\u00ed ' + dmr(zac) + '</span><span>uplynulo ' + p + ' %</span><span>smluvn\u00ed dokon\u010den\u00ed ' + dmr(kon) + '</span></div></div>';
  }
  // vyvoj po KD
  var vyvoj = D.kd.map(function (j) {
    var n = kdc(j['\u010c\u00edslo']);
    var u = D.ukoly.filter(function (z) { var zj = D.jById[z['Jedn\u00e1n\u00ed']]; return zj && kdc(zj['\u010c\u00edslo']) <= n; });
