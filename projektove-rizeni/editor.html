<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor zápisů – IN—FORM—ARCHITEKTI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.svg">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181A;--ink2:#4A4F55;--mut:#6B7178;--line:#D8D6CF;--line2:#E8E6E0;--bg:#F7F6F2;--card:#FFFFFF;
  --red:#B42318;--amber:#A35A08;--green:#2E7D4F;--sel:#ECEAE4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 80px}
h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0;font-weight:600}
.mut{color:var(--mut)}.ink2{color:var(--ink2)}.mono{font-family:'IBM Plex Mono',monospace}
.btn{min-height:40px;padding:8px 16px;border:1px solid var(--ink);background:var(--card);border-radius:0}
.btn:hover{background:var(--sel)}
.btn.p{background:var(--ink);color:#fff}.btn.p:hover{background:#2c2f33}
.btn.s{min-height:32px;padding:4px 10px;font-size:13px;border-color:#9A9EA3}
.btn.red{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.lnk{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  border:1px solid #B9B6AE;background:#fff;padding:8px 10px;min-height:40px;border-radius:0;width:100%}
textarea{min-height:110px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;min-height:32px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bar .grow{flex:1 1 220px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--ink);margin-top:16px}
.row{display:grid;grid-template-columns:110px 160px minmax(0,1fr) 110px;gap:16px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:baseline;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:hover{background:var(--sel)}
.oddil{display:flex;justify-content:space-between;align-items:baseline;padding:18px 0 8px;border-bottom:1.5px solid var(--ink)}
.oddil h3{margin:0;font-size:16px;font-weight:600}
.bod{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.bod .nm{font-weight:600;font-size:15.5px;line-height:1.3}
.bod .zn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink2);font-weight:500}
.bod .upr{font-size:13px;margin-top:8px;color:var(--ink2)}
.pct{font-size:13px;color:var(--ink2);margin-top:4px;display:flex;align-items:center;gap:6px}
.pbar{display:inline-block;width:80px;height:6px;border:1px solid var(--ink2);position:relative}.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}
.st{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;margin:4px 4px 0 0;border:1px solid #9A9EA3;color:var(--ink2);letter-spacing:.02em;white-space:nowrap}
.st.novy{border-color:var(--ink);color:var(--ink)}.st.rf{border:1.5px solid var(--red);color:var(--red)}
.st.kr{border-color:var(--amber);color:var(--amber)}.st.zp{border-color:var(--red);color:var(--red)}
.st.sp{border-color:var(--green);color:var(--green)}
.zaz{display:grid;grid-template-columns:178px minmax(0,1fr) 190px;gap:12px;padding:4px 0;font-size:14.5px;line-height:1.4;border-top:1px dotted var(--line2)}
.zaz:first-child{border-top:0}
.zaz .k{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mut);line-height:1.5}
.zaz.akt .t{font-weight:600}.zaz.akt .k{color:var(--ink)}
.zaz.kon .t,.zaz.kon .sd,.zaz.kon .k,.zaz.kon .k .typ{color:var(--red)}
.zaz.sch .t{font-style:italic;color:var(--ink2)}
.zaz.kz .t{border-left:2px solid var(--amber);padding-left:6px}
.zaz.pozde .ter{color:var(--red)}.zaz.brzy .ter{color:var(--amber);font-weight:600}
.dpl{display:block;margin-top:3px;font-weight:400;font-style:normal}.dpl .kdl{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink2)}
.dpl.kon,.dpl.kon .kdl{color:var(--red)}.dpl.akt{font-weight:600}.dpl button{margin-left:6px;font-size:12px;font-weight:400}
.st.zr{border-color:#6B7178;color:#6B7178}
.fg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;max-width:540px;font-weight:400;font-style:normal}
.fn{position:relative;padding:0;border:1px solid var(--line);background:var(--line2);aspect-ratio:4/3;overflow:hidden;cursor:pointer;display:block;width:100%}
.fn img{width:100%;height:100%;object-fit:cover;display:block}.fn img:not([src]){visibility:hidden}
.fn .fp{position:absolute;left:0;right:0;bottom:0;background:rgba(22,24,26,.64);color:#fff;font-size:11.5px;line-height:1.35;padding:2px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn .fs{position:absolute;top:4px;left:4px;background:#fff;font-size:11px;padding:0 4px;color:var(--ink2);font-weight:600}
.fn.mimo img{opacity:.4}.fn.nahr img{opacity:.55}
.fdet{display:flex;flex-direction:column;gap:6px;align-items:center}.fdet img{max-width:100%;max-height:58vh;display:block;border:1px solid var(--line)}
@media (hover:hover){.zaz [data-dopl]{visibility:hidden}.zaz:hover [data-dopl],.zaz:focus-within [data-dopl]{visibility:visible}}
.lnk.posun{font-size:12px;font-weight:400;color:var(--ink2)}
.zaz .posun.prazdny{visibility:hidden}.zaz:hover .posun.prazdny,.zaz:focus-within .posun.prazdny{visibility:visible}
.zaz .t button{margin-left:6px;font-size:12px;font-weight:400;font-style:normal}
.sd{display:flex;flex-direction:column;gap:0}
.zaz.akt .sd{font-weight:600}
.zaz .k .upr{display:block;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}
.zaz .k .del{font-weight:400}
.zaz .k .typ{display:block;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.late{color:var(--red)}
.vyr{display:inline-flex;align-items:center;gap:6px}
.vyr input{width:16px;height:16px;margin:0;accent-color:var(--green)}
.akce{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;justify-content:flex-end}
.del{text-decoration:line-through;color:var(--mut);font-weight:400}
.empty{padding:28px 0;color:var(--mut)}
dialog{border:1px solid var(--ink);padding:0;max-width:640px;width:calc(100% - 32px);border-radius:0}
dialog::backdrop{background:rgba(22,24,26,.35)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:22px 24px}
.dlg h3{margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ink)}
.seg button{flex:1 1 auto;border:0;border-right:1px solid var(--line);background:#fff;padding:8px 10px;min-height:38px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.lide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;max-height:220px;overflow:auto;border:1px solid var(--line2);padding:6px 10px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;max-width:90%;z-index:20;display:none}
.toast.err{background:var(--red)}
.toast .tb{margin-left:14px;background:none;border:1px solid #fff;color:#fff;padding:2px 10px;min-height:28px}
.mer{position:fixed;left:8px;bottom:6px;font:12px/1.4 'IBM Plex Mono',monospace;color:var(--mut);background:rgba(247,246,242,.92);border:1px solid var(--line2);padding:2px 8px;z-index:16;display:none;cursor:pointer;max-width:calc(100vw - 16px);white-space:pre-wrap}
.busy{position:fixed;inset:0;background:rgba(247,246,242,.6);display:none;align-items:center;justify-content:center;z-index:15;font-weight:600}
.box{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--ink);padding:28px}
.hidden{display:none!important}
.vyk{position:fixed;inset:0;background:var(--bg);z-index:12;display:flex;flex-direction:column}
.vyk .vh{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ink);flex-wrap:wrap}
.vyk .vb{flex:1;overflow:auto;padding:16px}
.plan{position:relative;display:inline-block;max-width:100%}
.plan img{display:block;max-width:100%;height:auto;border:1px solid var(--line)}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font:600 11px 'IBM Plex Mono',monospace;padding:2px 5px;white-space:nowrap;border:0;cursor:pointer}
.pin:after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:inherit}
.pin{border-top-color:var(--ink)}.pin.rf{background:var(--red);border-top-color:var(--red)}.pin.hot{background:var(--green);border-top-color:var(--green)}
.pin.akt{outline:3px solid #F2C94C}
.pinpick{cursor:crosshair}
.bod .navyk{font-size:13px;color:var(--ink2);margin-top:4px;display:block}
.predmet{white-space:pre-line;font-size:16px;line-height:1.45;margin:6px 0 4px;padding-left:10px;border-left:2px solid var(--ink);max-width:820px}
@media (max-width:860px){.bod{grid-template-columns:1fr}.zaz{grid-template-columns:1fr}.sd{flex-direction:row;flex-wrap:wrap;gap:4px 12px}.row{grid-template-columns:90px 1fr}.row .x{display:none}.grid2,.lide{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="busy" class="busy">Pracuji&#8230;</div>
<div id="toast" class="toast" role="status"></div>
<div id="mer" class="mer" title="Klepn\u011bte pro podrobnosti"></div>
<div id="vyk" class="vyk hidden"></div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgform"></form></dialog>
<input type="file" id="fotoinput" accept="image/*" multiple class="hidden">

<script>
(function () {
'use strict';
var S = { token: null, email: '', zakazky: [], D: null, jednaniId: null,
          filtr: { hledat: '', oddil: '', resitel: '', otevrene: true, poTerminu: false, kritTermin: false, historie: 3, schuzky: false } };
var $app = document.getElementById('app');
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

/* ---------- pomocne ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
var KRITICKY_TERMIN_DNU = 14;
/** Datum za n dni jako yyyy-mm-dd. */
function datumPlus(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dnes() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fd(iso) { if (!iso) return ''; var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '.' + m[2] + '.' + m[1] : String(iso); }
function fdk(iso) { var s = fd(iso); return s ? s.slice(0, 6) + s.slice(8) : ''; }
function kdc(v) { var m = String(v || '').match(/(\d+)/); return m ? parseInt(m[1], 10) : 0; }
function ids(s) { return String(s == null ? '' : s).split(',').map(function (x) { return x.trim(); }).filter(Boolean); }
function dmr(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? +m[3] + '.' + +m[2] + '.' + m[1] : ''; }
function rrmmdd(iso) { var m = String(iso || '').match(/^\d{2}(\d{2})-(\d{2})-(\d{2})/); return m ? m[1] + m[2] + m[3] : ''; }
function klic(z) { var c = String(z || '').match(/\d+/g); return c ? c.map(function (x) { return parseInt(x, 10); }).join('.') : ''; }
function kc(v) { return v === '' || v == null ? '' : String(Math.round(+v)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + '\u00a0K\u010d'; }

function toast(t, err, akce) {
  var el = document.getElementById('toast');
  el.textContent = t; el.className = 'toast' + (err ? ' err' : ''); el.style.display = 'block';
  if (akce) {
    var b = document.createElement('button');
    b.className = 'tb'; b.type = 'button'; b.textContent = akce.text;
    b.onclick = function () { clearTimeout(toast.t); el.style.display = 'none'; akce.fn(); };
    el.appendChild(b);
  }
  clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, err ? 7000 : akce ? 9000 : 3000);
}
function busy(on) { document.getElementById('busy').style.display = on ? 'flex' : 'none'; }

// Na webu (informarchitekti.cz) se aplikace vola jako datova sluzba pres doPost ve Web.gs;
// uvnitr Apps Scriptu pres google.script.run.
var NA_WEBU = !!window.APP_URL && !(window.google && google.script && google.script.run);
function volatSluzbu(fn, args) {
  return fetch(window.APP_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit',
      redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var o;
      try { o = JSON.parse(t); } catch (e) {
        var x = new Error('Služba aplikace neodpověděla. Zkuste to za chvíli znovu.'); x.ramec = true; throw x;
      }
      if (o.err) throw new Error(o.err);
      return o.ok;
    }, function () { throw new Error('Bez spojení se službou aplikace. Zkontrolujte připojení k internetu.'); });
}
function server(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (NA_WEBU) return volatSluzbu(fn, args);
  return new Promise(function (res, rej) {
    google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e); })[fn].apply(null, args);
  });
}
// mereni rychlosti: v levem dolnim rohu se ukaze doba posledni operace (false = skryt)
var ZOBRAZIT_MERENI = true;
var NAZVY_AKCI = { nacist: 'na\u010dten\u00ed zak\u00e1zky', smazatZaznam: 'smaz\u00e1n\u00ed pozn\u00e1mky', obnovitZaznam: 'vr\u00e1cen\u00ed pozn\u00e1mky',
  novyZaznam: 'nov\u00e1 pozn\u00e1mka', novyBod: 'nov\u00fd bod', upravitPoznamku: '\u00faprava pozn\u00e1mky', upravitUkol: '\u00fakol',
  upravitBod: '\u00faprava bodu', smazatBod: 'smaz\u00e1n\u00ed bodu', vratitSmazanyBod: 'vr\u00e1cen\u00ed bodu', zrusitBod: 'zru\u0161en\u00ed bodu',
  obnovitZrusenyBod: 'obnoven\u00ed bodu', novyDoplnek: 'dopln\u011bn\u00ed pozn\u00e1mky', upravitDoplnek: '\u00faprava dopl\u0148ku',
  nahratFoto: 'nahr\u00e1n\u00ed fotky', nahledy: 'n\u00e1hledy fotek', foto: 'origin\u00e1l fotky', upravitFoto: 'popis fotky', smazatFoto: 'smaz\u00e1n\u00ed fotky', vratitFoto: 'vr\u00e1cen\u00ed fotky', ulozitJednani: 'hlavi\u010dka', noveJednani: 'nov\u00e9 jedn\u00e1n\u00ed', pdf: 'PDF', vydat: 'vyd\u00e1n\u00ed z\u00e1pisu' };
S.cekajici = 0;
function sek(ms) { return (ms / 1000).toFixed(1).replace('.', ',') + ' s'; }
function ukazMereni(m, celkem) {
  S.mereni = { m: m, celkem: celkem };
  try { console.info('[m\u011b\u0159en\u00ed] ' + m.akce + ': server ' + m.server + ' ms, celkem ' + celkem + ' ms', m.kroky); } catch (e) { /* bez konzole */ }
  if (!ZOBRAZIT_MERENI) return;
  var el = document.getElementById('mer');
  el.textContent = (NAZVY_AKCI[m.akce] || m.akce) + ' \u00b7 server ' + sek(m.server) + ' \u00b7 celkem ' + sek(celkem);
  el.dataset.open = '';
  el.style.display = 'block';
}
document.getElementById('mer').onclick = function () {
  var el = this, x = S.mereni; if (!x) return;
  var otevrit = !el.dataset.open;
  el.dataset.open = otevrit ? '1' : '';
  el.textContent = (NAZVY_AKCI[x.m.akce] || x.m.akce) + ' \u00b7 server ' + sek(x.m.server) + ' \u00b7 celkem ' + sek(x.celkem) +
    (otevrit ? '\n' + x.m.kroky.map(function (k) { return ('     ' + k[1]).slice(-6) + ' ms  ' + k[0]; }).join('\n') +
      '\n(celkem \u2212 server = p\u0159enos a prohl\u00ed\u017ee\u010d)' : '');
};
window.addEventListener('beforeunload', function (e) {
  if (S.cekajici > 0) { e.preventDefault(); e.returnValue = ''; }
});
/** Volani serveru; volby.tise = bez zatmavene obrazovky (aplikace mezitim normalne funguje). */
function api(akce, data, volby) {
  volby = volby || {};
  var t0 = Date.now();
  if (!volby.tise) busy(true);
  S.cekajici++;
  return server('api', S.token, akce, data).then(function (r) {
    S.cekajici--; if (!volby.tise) busy(false);
    if (r && r._mereni) { ukazMereni(r._mereni, Date.now() - t0); delete r._mereni; }
    return r;
  }, function (e) {
    S.cekajici--; if (!volby.tise) busy(false);
    var m = (e && e.message) || String(e);
    if (m.indexOf('PRIHLASENI') >= 0) { S.token = null; ss('kd_token', null); toast('P\u0159ihl\u00e1\u0161en\u00ed vypr\u0161elo, p\u0159ihlaste se znovu.', true); login(); }
    else toast(m.replace(/^Error:\s*/, ''), true);
    throw e;
  });
}

/* ---------- data a odvozene hodnoty ---------- */
function idx() {
  var D = S.D;
  D.lideById = {}; D.lide.forEach(function (l) { D.lideById[String(l['ID'])] = l; });
  D.jednaniById = {}; D.jednani.forEach(function (j) { D.jednaniById[j['ID']] = j; });
  D.fotky = D.fotky || [];
  D.fotkyByZaz = {};
  D.fotky.forEach(function (x) { (D.fotkyByZaz[x['Z\u00e1znam']] = D.fotkyByZaz[x['Z\u00e1znam']] || []).push(x); });
  Object.keys(D.fotkyByZaz).forEach(function (k) { D.fotkyByZaz[k].sort(function (a, c) { return (+a['Po\u0159ad\u00ed'] || 0) - (+c['Po\u0159ad\u00ed'] || 0); }); });
  D.zazByBod = {}; D.doplByZaz = {};
  D.zaznamy.forEach(function (z) {
    (D.zazByBod[z['Bod']] = D.zazByBod[z['Bod']] || []).push(z);
    if (z['Dopl\u0148uje']) (D.doplByZaz[z['Dopl\u0148uje']] = D.doplByZaz[z['Dopl\u0148uje']] || []).push(z);
  });
  D.zlByBod = {}; D.zl.forEach(function (z) { var k = klic(z['Bod']); (D.zlByBod[k] = D.zlByBod[k] || []).push(z); });
}
function upsert(arr, obj, key) {
  key = key || 'ID';
  for (var i = 0; i < arr.length; i++) if (String(arr[i][key]) === String(obj[key])) { arr[i] = obj; return; }
  arr.push(obj);
}
function remove(arr, id) { for (var i = arr.length - 1; i >= 0; i--) if (String(arr[i]['ID']) === String(id)) arr.splice(i, 1); }
function jmeno(id, kratke) {
  var l = S.D.lideById[String(id)]; if (!l) return '';
  var j = String(l['Jm\u00e9no'] || '').trim(), p = String(l['P\u0159\u00edjmen\u00ed'] || '').trim();

/** Stav bodu z ukolu KD (stejne jako stavBodu na serveru). */
function stavBodu(zaz, limitKD, datum) {

  ukoly.forEach(function (z) {

/** Spolecne udaje pro pripravu bodu aktualniho jednani. */
function kontextBodu() {

/** Patri bod do jednani (vznikl nejpozdeji na nem)? */
function vJednani(b, k) { return kdc(b['KD vzniku']) <= k.limitKD || b['KD vzniku'] === k.j['\u010c\u00edslo']; }
/** Jeden bod a jeho poznamky pro aktualni jednani. */
function pripravJeden(b, k) {

  function viditelna(z) {
    var zj = D.jednaniById[z['Jedn\u00e1n\u00ed']];
    if (!zj) return false;
    if (z['Jedn\u00e1n\u00ed'] === j['ID']) return true;

    return da < dc ? -1 : da > dc ? 1 : String(a['Zna\u010dka']) < String(c['Zna\u010dka']) ? -1 : 1;

  // filtr resitele: jen ukoly zvolene osoby / firmy (s Jen otevrene jen nesplnene a splnene na tomto jednani)
  var zaz = zazVse;
  if (k.resitele) {
    zaz = zazVse.filter(function (z) {
      if (z['Typ'] !== '\u00fakol' || !ids(z['\u0158e\u0161itel\u00e9']).some(function (r) { return k.resitele[r]; })) return false;
      return !f.otevrene || !vyr(z, datumJ) || z['Vy\u0159e\u0161eno na'] === j['ID'];

  // filtr terminu: po terminu = k datu jednani (stejne jako cervene terminy a stitek zpozdeni),

    zl: D.zlByBod[klic(b['Zna\u010dka'])] || [], poradi: k.poradiOdd[+b['Odd\u00edl']] || +b['Odd\u00edl'] };

 */
function smazatPoznamku(zid) {
  var z = S.D.zaznamy.filter(function (x) { return x['ID'] === zid; })[0];
  if (!z) return;
  var bodId = z['Bod'], j = S.D.jednaniById[z['Jedn\u00e1n\u00ed']] || {};
  var bod = S.D.body.filter(function (b) { return b['ID'] === bodId; })[0];
  var zbyle = (S.D.zazByBod[bodId] || []).filter(function (x) { return x['ID'] !== zid; });
  var iBod = !!bod && !zbyle.length && jeKD(j) && kdc(bod['KD vzniku']) === kdc(j['\u010c\u00edslo']);
  var zakazkaId = S.D.zakazka.id;
  remove(S.D.zaznamy, zid);
  if (iBod) remove(S.D.body, bodId);
  idx(); prekreslitBody([bodId]);
  var pozadavek = api('smazatZaznam', { zakazkaId: zakazkaId, zaznamId: zid, bodPoznamky: bodId }, { tise: true }).then(function (r) {
    if (S.D.zakazka.id !== zakazkaId) return r;
    if (r.smazanBodId) remove(S.D.body, r.smazanBodId);
    if (r.bod) upsert(S.D.body, r.bod);
    idx(); prekreslitBody([bodId]);
    return r;
  }, function (e) {
    if (S.D.zakazka.id === zakazkaId) {
      upsert(S.D.zaznamy, z); if (iBod) upsert(S.D.body, bod);
      idx(); prekreslitBody([bodId]);
    }
    throw e;
  });
  pozadavek.catch(function () { /* chybu uz ohlasil api() */ });
  toast(iBod ? 'Pozn\u00e1mka i nov\u00fd bod ' + (bod['Zna\u010dka'] || '') + ' smaz\u00e1ny' : z['Dopl\u0148uje'] ? 'Dopln\u011bk smaz\u00e1n' : 'Pozn\u00e1mka ' + (z['Zna\u010dka'] || '') + ' smaz\u00e1na', false, {
    text: 'Vr\u00e1tit', fn: function () {
      pozadavek.then(function () {
        return api('obnovitZaznam', { zakazkaId: zakazkaId, zaznamId: zid, bodPoznamky: bodId }, { tise: true });
      }).then(function (r) {
        if (S.D.zakazka.id !== zakazkaId) return;
        if (r.bod) upsert(S.D.body, r.bod);
        if (r.zaznam) upsert(S.D.zaznamy, r.zaznam);
        idx(); prekreslitBody([bodId]);
        toast(r.zaznam['Dopl\u0148uje'] ? 'Dopln\u011bk vr\u00e1cen' : 'Pozn\u00e1mka ' + r.zaznam['Zna\u010dka'] + ' vr\u00e1cena');
      }, function () { /* chybu uz ohlasil api() */ });
    } });
}

/** Zmenseny nahled (JPEG) v prohlizeci; kdyz obrazek nejde nacist (napr. HEIC), vrati ''. */
function zmensit(soubor, max) {
  return new Promise(function (res) {
    var url = URL.createObjectURL(soubor), im = new Image();
    im.onload = function () {
      try {
        var k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.78));
      } catch (e) { res(''); }
      URL.revokeObjectURL(url);
    };
    im.onerror = function () { URL.revokeObjectURL(url); res(''); };
    im.src = url;
  });
}
function base64Souboru(soubor) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1] || ''); };
    r.onerror = function () { rej(new Error('Soubor nejde p\u0159e\u010d\u00edst.')); };
    r.readAsDataURL(soubor);
  });
}

/**

  var bodId = bodPoznamky(zaznamId), zakazkaId = S.D.zakazka.id, hotovo = 0, celkem = soubory.length;
  var fronta = Promise.resolve();
  soubory.forEach(function (soubor, i) {
    fronta = fronta.then(function () {
      if (S.D.zakazka.id !== zakazkaId) return;
      if (!/^image\//.test(soubor.type || '') && !/\.(jpe?g|png|heic|heif|webp|gif)$/i.test(soubor.name || '')) {
        toast('Soubor ' + soubor.name + ' nen\u00ed obr\u00e1zek.', true); return;
      }
      if (soubor.size > MAX_FOTO_MB * 1024 * 1024) { toast('Fotografie ' + soubor.name + ' je v\u011bt\u0161\u00ed ne\u017e ' + MAX_FOTO_MB + ' MB.', true); return; }
      var tmp = 'tmp-' + Date.now() + '-' + i, nahled = '';
      return zmensit(soubor, NAHLED_PX).then(function (n) {
        nahled = n;
        S.nahledy[tmp] = n;
        S.D.fotky.push({ 'ID': tmp, 'Z\u00e1znam': zaznamId, 'Bod': bodId, 'Po\u0159ad\u00ed': 9999 + i, 'Popis': '', 'Do z\u00e1pisu': 'ano', _nahrava: true });

        return api('nahratFoto', { zakazkaId: zakazkaId, zaznamId: zaznamId, bodPoznamky: bodId, nazev: soubor.name, mime: soubor.type,
          data: data, nahled: nahled ? nahled.split(',')[1] : '' }, { tise: true });

        remove(S.D.fotky, tmp); delete S.nahledy[tmp];

}
function obrazek(id) {
  S.obr = S.obr || {};
  if (S.obr[id]) return Promise.resolve(S.obr[id]);
  return api('vykres', { zakazkaId: S.D.zakazka.id, id: id }).then(function (r) { S.obr[id] = 'data:' + r.mime + ';base64,' + r.data; return S.obr[id]; });
}
function pinyHtml(vykresId, aktBod, kliknutelne) {
  return S.D.body.filter(function (b) { return String(b['V\u00fdkres']) === String(vykresId) && b['Pin X'] !== '' && b['Pin X'] != null; }).map(function (b) {
    var tr = b['Stav'] === 'Spln\u011bno' ? ' hot' : b['Priorita'] === 'RED FLAG' ? ' rf' : '';
    return '<button type="button" class="pin' + tr + (b['ID'] === aktBod ? ' akt' : '') + '" style="left:' + (+b['Pin X'] * 100) + '%;top:' + (+b['Pin Y'] * 100) + '%"' +
      (kliknutelne ? ' data-pinbod="' + esc(b['ID']) + '"' : ' tabindex="-1"') + ' title="' + esc(b['Zna\u010dka'] + ' ' + b['N\u00e1zev']) + '">' + esc(b['Zna\u010dka']) + '</button>';
  }).join('');
}
/** Vyber pinu v dialogu Upravit bod: klik do vykresu nastavi Pin X / Pin Y. */
function initPin(b) {
  var sel = document.getElementById('vyksel'), box = document.getElementById('pinbox'), info = document.getElementById('pininfo');
  var px = dform.querySelector('[name=pinX]'), py = dform.querySelector('[name=pinY]');
  function kresli() {
    var id = sel.value;
    if (!id) { box.innerHTML = ''; info.textContent = 'V\u00fdkresy nahrajte jako obr\u00e1zky do slo\u017eky V\u00ddKRESY zak\u00e1zky.'; return; }
    info.textContent = 'Klepn\u011bte do v\u00fdkresu na m\u00edsto bodu.';
    obrazek(id).then(function (src) {
      box.innerHTML = '<div class="plan pinpick" id="plan"><img src="' + src + '" alt="">' +
        (px.value !== '' ? '<span class="pin akt" style="left:' + (+px.value * 100) + '%;top:' + (+py.value * 100) + '%">' + esc(b['Zna\u010dka']) + '</span>' : '') + '</div>';
      var plan = document.getElementById('plan');
      plan.querySelector('img').onclick = function (ev) {
        var r = ev.target.getBoundingClientRect();
        px.value = ((ev.clientX - r.left) / r.width).toFixed(4); py.value = ((ev.clientY - r.top) / r.height).toFixed(4);
        kresli();
      };
    });
  }
  nactiVykresy().then(function (v) {
    sel.innerHTML = '<option value="">\u2014 bez v\u00fdkresu \u2014</option>' + v.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (String(b['V\u00fdkres']) === x.id ? ' selected' : '') + '>' + esc(x.nazev + (x.podlazi ? ' \u00b7 ' + x.podlazi : '')) + '</option>'; }).join('');
    kresli();
  });
  sel.onchange = function () { kresli(); };
  document.getElementById('pinsmaz').onclick = function () { px.value = ''; py.value = ''; sel.value = ''; kresli(); };
}
/** Celoobrazovkovy prehled vykresu se vsemi piny; klik na pin prejde na bod. */
function zobrazVykresy(vykresId, aktBod) {
  var el = document.getElementById('vyk');
  nactiVykresy().then(function (v) {
    if (!v.length) return toast('Ve slo\u017ece V\u00ddKRESY zat\u00edm nejsou \u017e\u00e1dn\u00e9 obr\u00e1zky.', true);
    vykresId = vykresId || v[0].id;
    el.innerHTML = '<div class="vh"><b>V\u00fdkres</b><select id="vyks" style="width:auto">' + v.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === String(vykresId) ? ' selected' : '') + '>' + esc(x.nazev + (x.podlazi ? ' \u00b7 ' + x.podlazi : '')) + '</option>'; }).join('') + '</select>' +
      '<span class="mut" style="font-size:13px">\u010dern\u011b otev\u0159en\u00e9 \u00b7 \u010derven\u011b red flag \u00b7 zelen\u011b spln\u011bn\u00e9</span><span style="flex:1"></span><button class="btn" id="vykz">Zav\u0159\u00edt</button></div><div class="vb" id="vykb"></div>';
    el.classList.remove('hidden');
    document.getElementById('vykz').onclick = function () { el.classList.add('hidden'); };
    document.getElementById('vyks').onchange = function (e) { zobrazVykresy(e.target.value, aktBod); };
    obrazek(vykresId).then(function (src) {
      document.getElementById('vykb').innerHTML = '<div class="plan"><img src="' + src + '" alt="">' + pinyHtml(vykresId, aktBod, true) + '</div>';
      el.querySelectorAll('[data-pinbod]').forEach(function (p) { p.onclick = function () {
        el.classList.add('hidden');
        var bod = S.D.body.filter(function (x) { return x['ID'] === p.dataset.pinbod; })[0];
        S.filtr.hledat = bod['Zna\u010dka']; S.filtr.otevrene = false; editor();
      }; });
    });
  });
}

function pocetFotekKD(j) {
  return S.D.fotky.filter(function (x) { return x['Jedn\u00e1n\u00ed'] === j['ID'] && x['Do z\u00e1pisu'] !== 'ne' && !x._nahrava; }).length;
}
function volbaNahledu(j) {
  var n = pocetFotekKD(j);
  return '<label class="chk"><input type="checkbox" name="jenOtevrene"' + (j['Jen otev\u0159en\u00e9 body'] === 'ano' ? ' checked' : '') + '> Jen otev\u0159en\u00e9 body</label>' +
    '<p class="mut" style="margin:0;font-size:13px">Do z\u00e1pisu se vep\u00ed\u0161\u00ed jen otev\u0159en\u00e9 body. Spln\u011bn\u00e9 body (i spln\u011bn\u00e9 na tomto KD) a vy\u0159e\u0161en\u00e9 \u00fakoly se neuv\u00e1d\u011bj\u00ed; souhrn na kryc\u00edm listu je po\u010d\u00edt\u00e1 d\u00e1l.</p>' +
    '<label class="chk"><input type="checkbox" name="nahledy"' + (j['N\u00e1hledy fotek'] === 'ano' ? ' checked' : '') + '> Tisknout s n\u00e1hledy fotografi\u00ed</label>' +
    '<p class="mut" style="margin:0;font-size:13px">' + (n ? 'Fotek vybran\u00fdch do z\u00e1pisu z tohoto KD: ' + n + '. ' : 'Z tohoto KD zat\u00edm nen\u00ed \u017e\u00e1dn\u00e1 fotka vybran\u00e1 do z\u00e1pisu. ') +
    'S n\u00e1hledy se pod pozn\u00e1mkou vytisknou fotky po t\u0159ech v \u0159ad\u011b s n\u00e1zvem souboru a popisem. Bez n\u00e1hled\u016f se u pozn\u00e1mky uvede jen odkaz \u2013 n\u00e1zev souboru ve slo\u017ece ' + esc(nazevVyberu(j)) + '.</p>';
}
/** Koncept PDF s volbou nahledu fotek. */
function dlgPdf() {
  var j = J();
  otevrit('<h3>Koncept PDF \u2013 KD ' + kdc(j['\u010c\u00edslo']) + '</h3>' + volbaNahledu(j) + paticka('Vytvo\u0159it PDF'), function (fd2) {
    var s = !!fd2.get('nahledy'), jo = !!fd2.get('jenOtevrene');
    zavrit(); j['N\u00e1hledy fotek'] = s ? 'ano' : 'ne'; j['Jen otev\u0159en\u00e9 body'] = jo ? 'ano' : 'ne';
    udelatPdf(kdc(j['\u010c\u00edslo']), true, false, s, jo);
  });
}
function udelatPdf(cislo, kon, sch, nahledy, jenOtevrene) {
  api('pdf', { zakazkaId: S.D.zakazka.id, cislo: cislo, koncept: kon, poznamkySchuzek: sch, historie: 'vse', nahledy: nahledy, jenOtevrene: jenOtevrene }).then(function (r) {
    toast('PDF vytvo\u0159eno ve slo\u017ece ' + (r.slozka || 'z\u00e1pis\u016f'));
    window.open(r.url, '_blank');
  });
}

function vydat() {
  var j = J();
  otevrit('<h3>Vydat ostr\u00fd z\u00e1pis ' + esc(j['\u010c\u00edslo']) + '</h3>' +
    '<p style="margin:0">Jedn\u00e1n\u00ed se uzamkne a PDF se ulo\u017e\u00ed jako z\u00e1vazn\u00e1 verze. Origin\u00e1ly vybran\u00fdch fotek se zkop\u00edruj\u00ed do slo\u017eky ' + esc(nazevVyberu(j)) + '.</p>' +
    volbaNahledu(j) + paticka('Vydat z\u00e1pis'), function (fd2) {
    zavrit();
    api('vydat', { zakazkaId: S.D.zakazka.id, jednaniId: j['ID'], nahledy: !!fd2.get('nahledy'), jenOtevrene: !!fd2.get('jenOtevrene') }).then(function (r) {
      upsert(S.D.jednani, r.jednani); idx(); editor();
      var fv = r.fotovyber;
      toast('Z\u00e1pis vyd\u00e1n' + (r.slozka ? ' \u00b7 PDF ve slo\u017ece ' + r.slozka : '') + (fv && fv.pocet ? ' \u00b7 ' + fv.pocet + ' fotek ve slo\u017ece ' + fv.slozka : '') + (fv && fv.chyba ? ' \u00b7 fotov\u00fdb\u011br se nepovedl: ' + fv.chyba : ''), !!(fv && fv.chyba));
      window.open(r.url, '_blank');
    });
  });
}

/* ---------- start ---------- */
function start() { S.token = ss('kd_token'); if (S.token) zakazky(); else login(); }
// nova sluzba jeste neni nasazena (stary Web.gs bez doPost) -> docasne puvodni zobrazeni v ramu
if (NA_WEBU) volatSluzbu('ping', []).then(start, function (e) { if (e && e.ramec) location.replace('editor-ram.html'); else { start(); } });
else start();
})();
</script>
